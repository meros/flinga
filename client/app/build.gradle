plugins { id "com.android.application" }

android {
    namespace "se.lite.play"
    compileSdk 35
    defaultConfig {
        applicationId "se.lite.play"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Sideload build for the owner's own TV: sign with the local debug key.
            signingConfig signingConfigs.debug
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Offline harness: fixtures in, screenshots out. See README.md.
                systemProperty "fixtures.dir", rootProject.file("fixtures").absolutePath
                systemProperty "shots.dir", rootProject.file("shots").absolutePath
                systemProperty "scenario", (project.findProperty("scenario") ?: "")
                systemProperty "record.prefs", (project.findProperty("recordPrefs") ?: "")
                systemProperty "robolectric.graphicsMode", "NATIVE"
                testLogging { events "failed"; exceptionFormat "full"; showStandardStreams = true }
                outputs.upToDateWhen { false }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = "1.5.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "io.nayuki:qrcodegen:1.8.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
